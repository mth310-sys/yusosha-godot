name: Build and Deploy Godot Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.2
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Install export templates
        run: |
          curl -L -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q templates.tpz -d templates
          cp templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import project
        run: ./godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --quit --path .

      - name: Export Web
        run: |
          mkdir -p build/web
          ./godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture Godot Web screenshot
        run: |
          mkdir -p artifacts
          python3 -m http.server 8080 --directory build/web > /tmp/godot-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async() => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            page.on('console', msg => console.log('[browser]', msg.type(), msg.text()));
            page.on('pageerror', err => console.error('[pageerror]', err.message));
            await page.goto('http://127.0.0.1:8080/', { waitUntil: 'networkidle', timeout: 120000 });
            await page.waitForTimeout(8000);
            await page.screenshot({ path: 'artifacts/zelvolt-web.png', fullPage: true });
            await browser.close();
          })();
          NODE

      - name: Upload visual check artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-screenshot
          path: artifacts/zelvolt-web.png
          if-no-files-found: error

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
